version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - camcima
    ignore:
      # NestJS 12 needs a coordinated migration (all @nestjs/* packages plus
      # the peerDependencies range), not piecemeal Dependabot bumps.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - camcima
