name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        if: matrix.node-version != 22
        run: pnpm test

      - name: Test with coverage
        if: matrix.node-version == 22
        run: pnpm run test:cov

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == 22 }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  nestjs-compat:
    name: NestJS ${{ matrix.nestjs-version }} compatibility
    runs-on: ubuntu-latest

    # The devDependencies pin the newest supported NestJS, so the `build` job
    # only ever exercises that one. peerDependencies also advertise older
    # majors -- this job proves that claim instead of assuming it.
    strategy:
      matrix:
        nestjs-version: [10]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies with NestJS ${{ matrix.nestjs-version }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -D --no-frozen-lockfile \
            "@nestjs/common@${{ matrix.nestjs-version }}" \
            "@nestjs/core@${{ matrix.nestjs-version }}" \
            "@nestjs/microservices@${{ matrix.nestjs-version }}" \
            "@nestjs/platform-express@${{ matrix.nestjs-version }}" \
            "@nestjs/testing@${{ matrix.nestjs-version }}"

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

  security-audit:
    name: Security Audit (prod)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # This library ships zero runtime dependencies, so only production deps
      # can reach consumers. Fail CI on those. Dev/build-tooling advisories are
      # surfaced (non-blocking) by the OSV-Scanner job below. pnpm understands
      # dev vs prod groups, which osv-scanner cannot do for pnpm lockfiles.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Informational only. osv-scanner cannot scope by dependency group for
      # pnpm lockfiles, so it reports dev/build-chain advisories too. Kept as a
      # non-blocking signal; the consumer-facing gate is the security-audit job.
      - name: Run OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            .
